services:
  postgres:
    image: postgres:16-alpine
    container_name: joineazy-db
    environment:
      POSTGRES_DB: joineazy
      POSTGRES_USER: joineazy_user
      POSTGRES_PASSWORD: joineazy_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joineazy_user -d joineazy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: joineazy-api
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Backend/src:/app/src

  frontend:
    build:
      context: ./Fronend/joineazy
      dockerfile: Dockerfile
    container_name: joineazy-ui
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./Fronend/joineazy/src:/app/src

volumes:
  pgdata:
